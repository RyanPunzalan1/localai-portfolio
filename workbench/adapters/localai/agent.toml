# LocalAI's own agent (agent.py DocAgent) as a workbench agent. Level L1: every proposed write is sent to the approval
# endpoint before anything is applied. The image is the app image, built locally by the project (not pinned by digest,
# so this reference agent is allowed in Tier 1 only).
contract = 1
name = "localai-docagent"
image = "localai-localai:latest"
entrypoint = ["python3", "/run/adapter/run.py"]

[model]
api = "ollama-chat"
needs_tools = true

[capabilities]
file_read = true
file_write = "approval"
shell = false
network_client = false

[approval]
supported = true

[limits]
timeout_seconds = 600
