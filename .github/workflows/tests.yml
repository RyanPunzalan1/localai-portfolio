name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Unit tests only. They do not need Ollama or a model. The eval script
      # (evals/run_evals.py) needs a local model, so it is not run in CI.
      - run: |
          python tests/test_tasks.py
          python tests/test_pending.py
          python tests/test_brain.py
          python tests/test_security.py
          python tests/test_evals.py
          python tests/test_integration.py
          python tests/test_lessons.py
          python tests/test_lesson_capture.py
          python tests/test_lessons_agent.py
          python tests/test_write_guard.py
          python tests/test_recall_evals.py
          python tests/test_packs.py
          python tests/test_pack_tasks.py
          python tests/test_pack_lessons.py
          python evals/run_handoff_evals.py
          python evals/run_recall_evals.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # Blocking: real-bug lint rules from ruff.toml.
      - run: ruff check .
      # Blocking. The four chromadb advisories below have no fix yet and the app does not
      # reach the code they affect (in-process client only; see design/threat-model.md). Any
      # other finding fails the build. Remove an ignore once a fixed version is pinned.
      - run: >
          pip-audit -r requirements.txt
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815
          --ignore-vuln PYSEC-2026-3813

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t localai .
      # Fails only on HIGH or CRITICAL findings that have a fix available. Findings with no fix
      # yet are listed in design/threat-model.md. Trivy is pinned so a new release cannot change
      # the result by itself.
      - run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0
          image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 localai

  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Pinned, so a new release cannot change the result by itself.
      - run: npm install --no-save @mermaid-js/mermaid-cli@11
      # The CI runner runs as root, and Chrome will not start without --no-sandbox there.
      - run: |
          echo '{"args": ["--no-sandbox", "--disable-setuid-sandbox"]}' > /tmp/puppeteer.json
      # Renders every Mermaid block in the design docs. A syntax error fails the build.
      - run: |
          python3 - <<'PY'
          import re, pathlib, subprocess, sys
          failed = False
          for doc in ["design/codebase-map.md", "design/architecture.md"]:
              text = pathlib.Path(doc).read_text(encoding="utf-8")
              for i, block in enumerate(re.findall(r"```mermaid\n(.*?)```", text, re.S), 1):
                  src = pathlib.Path(f"/tmp/{pathlib.Path(doc).stem}_{i}.mmd")
                  src.write_text(block, encoding="utf-8")
                  r = subprocess.run(["npx", "mmdc", "-p", "/tmp/puppeteer.json", "-i", str(src), "-o", str(src.with_suffix(".svg")), "-q"])
                  if r.returncode != 0:
                      print(f"FAILED: {doc} diagram {i}")
                      failed = True
          sys.exit(1 if failed else 0)
          PY
