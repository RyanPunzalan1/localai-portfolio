name: localai_smoke
version: 0.1.0
description: "LocalAI stand-in tools over dummy notes: reads, and staged (never applied) writes, with a call log and an allowlist hook."
author: LocalAI
provides_tools:
  - list_files
  - read_file
  - save_note
  - list_tasks
  - add_task
  - complete_task
provides_hooks:
  - pre_tool_call
  - post_api_request
  - pre_api_request
